[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astock-backtester"
version = "1.6.0"
description = "Windows desktop A-share daily historical backtester backend"
requires-python = ">=3.11"
dependencies = [
  "adata>=2.9.5",
  "akshare>=1.16",
  "beautifulsoup4>=4.14",
  "curl_cffi>=0.15",
  "duckdb>=1.0",
  "langchain-text-splitters>=0.3",
  "numpy>=1.26",
  "openai>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
astock-backtester = "astock_backtester.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Offline scripts intentionally adjust sys.path before importing the backend package.
"scripts/*.py" = ["E402"]
